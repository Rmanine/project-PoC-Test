name: Tests & Coverage

on:
  push:
    branches: [develop]
  pull_request:
    branches: ['*']

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: make install

      - name: Run coverage
        run: make coverage

      # ── Commento sulla PR ──────────────────────────────────────
      - name: Pytest coverage comment (PR only)
        if: github.event_name == 'pull_request'
        uses: MishaKav/pytest-coverage-comment@v1
        with:
          pytest-coverage-path: ./pytest-coverage.txt
          junitxml-path: ./pytest.xml
          title: 'Coverage Report — Lambda Unit Tests'

      # ── Codecov: dashboard storico + badge ────────────────────
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
            token: ${{ secrets.CODECOV_TOKEN }}

      # ── Auto-aggiorna badge nel README su push a main ─────────
      - name: Update README badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: coverage_badge
        uses: MishaKav/pytest-coverage-comment@v1
        with:
          pytest-coverage-path: ./pytest-coverage.txt
          junitxml-path: ./pytest.xml
          hide-comment: true   # non posta commento, usa solo l'output

      - name: Write badge to README
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          sed -i '/<!-- Pytest Coverage Comment:Begin -->/,/<!-- Pytest Coverage Comment:End -->/c\<!-- Pytest Coverage Comment:Begin -->\n${{ steps.coverage_badge.outputs.coverageHtml }}\n<!-- Pytest Coverage Comment:End -->' ./README.md

      - name: Commit updated README
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'docs: aggiorna badge coverage'
          file_pattern: README.md