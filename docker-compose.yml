version: "3.9"

services:
  db:
    image: postgres:15
    container_name: sonardb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sonar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sonar}
      POSTGRES_DB: ${POSTGRES_DB:-sonarqube}
    volumes:
      - ./volumes/postgres/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sonar}"]
      interval: 10s
      timeout: 5s
      retries: 5

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      SONARQUBE_JDBC_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-sonarqube}
      SONARQUBE_JDBC_USERNAME: ${POSTGRES_USER:-sonar}
      SONARQUBE_JDBC_PASSWORD: ${POSTGRES_PASSWORD:-sonar}
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
      JAVA_OPTS: "-Xms512m -Xmx1024m"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ./volumes/sonarqube/data:/opt/sonarqube/data
      - ./volumes/sonarqube/extensions:/opt/sonarqube/extensions
      - ./volumes/sonarqube/logs:/opt/sonarqube/logs

  sonar-scanner:
    image: sonarsource/sonar-scanner-cli
    container_name: sonar-scanner
    depends_on:
      - sonarqube
    network_mode: host
    volumes:
      - ./sam_local_backend:/usr/src
    working_dir: /usr/src
    environment:
      SONAR_HOST_URL: http://localhost:9000
      SONAR_TOKEN: ${SONAR_TOKEN}
    profiles:
      - scan     